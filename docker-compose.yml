name: mewvia

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  bot:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    image: mewvia-bot:latest
    restart: unless-stopped
    init: true          # PID-1 zombie reaping for ffmpeg subprocesses
    group_add:
      - "101"           # Access files downloaded by local telegram-bot-api (GID 101)
    env_file: .env
    environment:
      # Service wiring (overrides .env so compose stays the source of truth for hosts)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      TMP_DIR: /data/tmp
      BACKUP_DIR: /data/backups
      BACKUP_REQUIRE_ENCRYPTION: 'true'
      MEDIA_WORKER_SOCKET: /run/mewvia/media.sock
    depends_on:
      media-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
      warp:
        condition: service_started
    volumes:
      - mewvia_data:/data
      - media_tmp:/data/tmp
      - worker_socket:/run/mewvia:ro
      - mewvia_botapi:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys,time; sys.exit(not all(p.exists() and time.time()-p.stat().st_mtime < 90 for p in map(pathlib.Path, ['/data/health','/data/health.ready'])))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  media-worker:
    build: .
    image: mewvia-bot:latest
    user: '0:0'
    init: true
    restart: unless-stopped
    command: ['sh', '/app/app/media/egress.sh']
    networks: [media_egress]
    cap_add: [NET_ADMIN]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    environment:
      BOT_TOKEN: '1:unused'
      JOB_TIMEOUT: ${JOB_TIMEOUT:-120}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-134217728}
    volumes:
      # Read-only: the extractors need the cookie jar the admin panel writes
      # under /data/cookies. Without it every cookie-gated platform (Instagram)
      # failed once with FileNotFoundError and silently retried anonymously.
      - mewvia_data:/data:ro
      - media_tmp:/data/tmp
      - worker_socket:/run/mewvia
    depends_on:
      warp:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-S', '/run/mewvia/media.sock']
      interval: 10s
      timeout: 3s
      retries: 6

  postgres:
    logging: *default-logging
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mewvia}
      POSTGRES_USER: ${POSTGRES_USER:-mewvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - mewvia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mewvia} -d ${POSTGRES_DB:-mewvia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    logging: *default-logging
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - mewvia_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Local Bot API Server.
  # The public Bot API caps downloads at 20MB and uploads at 50MB. Running this
  # service lifts both to ~2GB.
  # ---------------------------------------------------------------------------
  telegram-bot-api:
    logging: *default-logging
    image: aiogram/telegram-bot-api@sha256:67fc1c033fab0ed8266cb76bbeadbafe1924c25b6515f7ca4e6d398ece8e9372
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - mewvia_botapi:/var/lib/telegram-bot-api
      - mewvia_data:/data
      - media_tmp:/data/tmp
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cloudflare WARP Outbound Proxy
  # Bypasses datacenter IP blocks and YouTube/Instagram login walls.
  # ---------------------------------------------------------------------------
  warp:
    networks: [default, media_egress]
    logging: *default-logging
    build: ./warp
    image: mewvia-warp:latest
    container_name: mewvia-warp
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: '1'
    expose:
      - "1080"
      - "4416"
    volumes:
      - mewvia_warpdata:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # YouTube PO Token Provider (Proof of Origin)
  # Runs inside WARP network namespace so PO-tokens match the outbound IP.
  # ---------------------------------------------------------------------------
  bgutil-provider:
    logging: *default-logging
    image: brainicism/bgutil-ytdlp-pot-provider@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
    restart: unless-stopped
    network_mode: "service:warp"
    depends_on:
      warp:
        condition: service_healthy

networks:
  media_egress:

volumes:
  media_tmp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=768m,uid=10001,gid=10001,mode=0755,nosuid,nodev
  worker_socket:
  mewvia_data:
  mewvia_pgdata:
  mewvia_redisdata:
  mewvia_botapi:
  mewvia_warpdata:
